<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Créditos Disponibles</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @for (item of credits; track item.bankName) {
    <div>
      <ion-card>
        <ion-card-header [style.backgroundColor]="item.logoColor" style="color: white;">
          <ion-card-title style="color: white;">
            <ion-icon name="wallet-outline"></ion-icon> {{ item.bankName }}
          </ion-card-title>
          <ion-card-subtitle style="color: #e0e0e0;">{{ item.creditType }}</ion-card-subtitle>
        </ion-card-header>

        <ion-card-content class="ion-padding-top">
          <ion-text color="success">
            <h2 style="font-size: 1.5rem; font-weight: bold; margin: 5px 0;">
              RD$ {{ item.availableAmount | number:'1.2-2' }}
            </h2>
          </ion-text>

          <p style="margin-bottom: 10px; color: #555;">{{ item.description }}</p>

          <ion-chip color="tertiary">
            <ion-icon name="information-circle-outline"></ion-icon>
            <ion-label>Tasa: {{ item.interestRate }}</ion-label>
          </ion-chip>
        </ion-card-content>
      </ion-card>
    </div>
  }
</ion-content>
