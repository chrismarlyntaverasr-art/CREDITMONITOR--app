<ion-header>
  <ion-toolbar color="primary">

    <ion-title>
      Perfil de Usuario
    </ion-title>

  </ion-toolbar>
</ion-header>


<ion-content class="ion-padding">


  <!-- =====================================================
       FOTO DE PERFIL
       ===================================================== -->

  <div class="profile-photo-section">

    @if (fotoPerfil) {

      <img
        [src]="fotoPerfil"
        alt="Foto de perfil"
        class="profile-photo"
      />

    } @else {

      <div class="profile-photo-placeholder">

        <ion-icon
          name="person-outline">
        </ion-icon>

      </div>

    }


    <!-- Botón cambiar foto -->

    <ion-button
      fill="outline"
      size="small"
      type="button"
      (click)="seleccionarFoto()">

      <ion-icon
        name="camera-outline"
        slot="start">
      </ion-icon>

      CAMBIAR FOTO

    </ion-button>


    <!-- Selector de imagen oculto -->

    <input
      #fileInput
      type="file"
      accept="image/*"
      class="hidden-file-input"
      (change)="onFileSelected($event)"
    />

  </div>



  <!-- =====================================================
       DATOS PERSONALES
       ===================================================== -->

  <ion-card>

    <ion-card-header>

      <ion-card-title>

        <ion-icon
          name="person-outline">
        </ion-icon>

        Datos Personales

      </ion-card-title>

    </ion-card-header>


    <ion-card-content>


      <!-- Nombre -->

      <ion-item lines="full">

        <ion-label position="stacked">
          Nombre Completo
        </ion-label>

        <ion-input
          [(ngModel)]="user.fullName"
          name="fullName"
          ngDefaultControl>
        </ion-input>

      </ion-item>


      <!-- Correo -->

      <ion-item lines="full">

        <ion-label position="stacked">
          Correo Electrónico
        </ion-label>

        <ion-input
          type="email"
          [(ngModel)]="user.email"
          name="email"
          ngDefaultControl>
        </ion-input>

      </ion-item>


      <!-- Teléfono -->

      <ion-item lines="full">

        <ion-label position="stacked">
          Teléfono
        </ion-label>

        <ion-input
          type="tel"
          [(ngModel)]="user.phone"
          name="phone"
          ngDefaultControl>
        </ion-input>

      </ion-item>


      <!-- Banco -->

      <ion-item lines="none">

        <ion-label position="stacked">
          Banco Principal Asociado
        </ion-label>

        <ion-select
          [(ngModel)]="user.associatedBank"
          name="associatedBank"
          interface="action-sheet"
          ngDefaultControl>

          @for (
            bank of banks;
            track bank
          ) {

            <ion-select-option
              [value]="bank">

              {{ bank }}

            </ion-select-option>

          }

        </ion-select>

      </ion-item>


      <!-- Guardar cambios -->

      <ion-button
        expand="block"
        class="ion-margin-top"
        type="button"
        (click)="saveProfile()">

        GUARDAR CAMBIOS

      </ion-button>


    </ion-card-content>

  </ion-card>



  <!-- =====================================================
       CERRAR SESIÓN
       ===================================================== -->

  <ion-button
    expand="block"
    color="danger"
    fill="outline"
    class="logout-button"
    type="button"
    (click)="cerrarSesion()">

    <ion-icon
      name="log-out-outline"
      slot="start">
    </ion-icon>

    CERRAR SESIÓN

  </ion-button>


  <!-- Espacio inferior -->

  <div class="profile-bottom-space"></div>


</ion-content>
